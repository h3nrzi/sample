# Global settings
interface = lo
default = deny
log = firewall.log
rate_limit_per_sec = 100
rate_window_sec = 1

# Rules: ACTION PROTO SRC_IP DST_IP SRC_PORT DST_PORT [description]
# Allow local DNS queries
allow udp 127.0.0.1 127.0.0.1 0 53 allow_local_dns
# Allow loopback traffic
allow tcp 127.0.0.1 127.0.0.1 * * allow_loopback_tcp
allow udp 127.0.0.1 127.0.0.1 * * allow_loopback_udp
# Deny everything else (implicit by default)
